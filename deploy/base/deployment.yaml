---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal
  labels:
    app.kubernetes.io/name: patient-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patient-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patient-portal
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: patient-portal
      initContainers: []
      containers:
        - name: patient-portal
          image: ghcr.io/kenmoini/demo-patient-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          # envFrom:
          #   - configMapRef:
          #       name: patient-portal-config
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
          envFrom:
            - secretRef:
                name: patient-portal-config
          volumeMounts:
            - name: db
              mountPath: /data/db
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          # livenessProbe:
          #   httpGet: { path: /healthz/live, port: http }
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet: { path: /healthz/ready, port: http }
          #   periodSeconds: 5
          #   failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: sqlite