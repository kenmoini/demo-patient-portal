---
apiVersion: v1
kind: Secret
metadata:
  name: patient-portal-config
stringData:
  # Copy to .env and fill in. All values are read from the environment by app.config.Settings.
  DATABASE_URL: sqlite:///./patient_portal.sqlite3
  KEYCLOAK_ISSUER: https://keycloak.example.com/auth/realms/patient-portal
  KEYCLOAK_CLIENT_ID: patient-portal
  KEYCLOAK_CLIENT_SECRET: some-secret
  KEYCLOAK_JWKS_URL: https://keycloak.example.com/auth/realms/patient-portal/protocol/openid-connect/certs
  OIDC_REDIRECT_URI: "https://patient-portal.example.com/auth/callback"
  SESSION_SECRET: b516ee407a468b444c7816ebea8f7f271b08433c31c2fff608df3f465ec999c1 # openssl rand -hex 32
  APP_BASE_URL: https://patient-portal.example.com
