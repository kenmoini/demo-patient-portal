apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: patient-portal

resources:
  - ../../base/
  - route.yaml
  - configmap-root-ca.yaml

patches:
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: patient-portal
  - path: patch-volumeMounts.yaml
    target:
      kind: Deployment
      name: patient-portal
  - path: patch-volumes.yaml
    target:
      kind: Deployment
      name: patient-portal